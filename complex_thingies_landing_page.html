<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complex Thingies Development, LLC</title>
    <meta name="description" content="Custom mobile software development by Complex Thingies Development, LLC. Based in Livingston, Texas.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for Contact Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        darkBase: '#0b0c10',
                        darkCard: '#1f2833',
                        cyanAccent: '#45a29e',
                        cyanBright: '#66fcf1',
                        grayText: '#c5c6c7'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    boxShadow: {
                        'neon': '0 0 20px rgba(102, 252, 241, 0.3)',
                        'neon-strong': '0 0 30px rgba(102, 252, 241, 0.6)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            overflow-x: hidden;
        }
        
        /* Schematic Background Overlay */
        .schematic-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            opacity: 0.15;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(102, 252, 241, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(102, 252, 241, 0.3) 1px, transparent 1px),
                linear-gradient(rgba(102, 252, 241, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(102, 252, 241, 0.1) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            background-position: -1px -1px, -1px -1px, -1px -1px, -1px -1px;
        }

        /* Radial gradient to create focus in the center */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 0%, #0b0c10 85%);
        }

        /* Subtle glowing text */
        .text-glow {
            text-shadow: 0 0 12px rgba(102, 252, 241, 0.4);
        }

        /* Card backdrop */
        .glass-card {
            background: linear-gradient(145deg, rgba(31, 40, 51, 0.9), rgba(11, 12, 16, 0.9));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(102, 252, 241, 0.2);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex items-center justify-center relative selection:bg-cyanBright selection:text-darkBase">

    <!-- The CSS Grid Background -->
    <div class="schematic-bg"></div>
    
    <!-- SVG Circuit Nodes drawn directly into the background for the "Wireframe" look -->
    <svg class="fixed inset-0 w-full h-full z-0 opacity-20 pointer-events-none" xmlns="http://www.w3.org/2000/svg">
        <pattern id="circuit" x="0" y="0" width="200" height="200" patternUnits="userSpaceOnUse">
            <path d="M 50 50 L 100 100 L 200 100 M 150 0 L 150 50 L 200 100 M 0 150 L 50 150 L 100 200" fill="none" stroke="#66fcf1" stroke-width="1"/>
            <circle cx="50" cy="50" r="3" fill="#0b0c10" stroke="#66fcf1" stroke-width="2"/>
            <circle cx="100" cy="100" r="4" fill="#66fcf1" />
            <circle cx="150" cy="50" r="2" fill="#66fcf1" />
            <rect x="95" y="195" width="10" height="10" fill="none" stroke="#66fcf1" stroke-width="1" />
        </pattern>
        <rect width="100%" height="100%" fill="url(#circuit)" />
    </svg>

    <div class="vignette"></div>

    <!-- Main Content Container -->
    <main class="relative z-10 w-full max-w-3xl p-4 sm:p-6 my-10">
        
        <div class="glass-card rounded-3xl p-8 sm:p-12 shadow-neon relative overflow-hidden group">
            
            <!-- Animated corner accents inside the card -->
            <div class="absolute top-0 left-0 w-16 h-16 border-t-2 border-l-2 border-cyanBright opacity-50 rounded-tl-3xl m-4 transition-transform group-hover:-translate-x-2 group-hover:-translate-y-2"></div>
            <div class="absolute bottom-0 right-0 w-16 h-16 border-b-2 border-r-2 border-cyanBright opacity-50 rounded-br-3xl m-4 transition-transform group-hover:translate-x-2 group-hover:translate-y-2"></div>

            <!-- Logo Section -->
            <div class="flex justify-center mb-8 relative">
                <!-- Inline SVG Logo: 'CT' intertwined in a smartphone -->
                <svg viewBox="0 0 120 120" class="w-32 h-32 sm:w-40 sm:h-40 drop-shadow-[0_0_15px_rgba(102,252,241,0.6)]" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <!-- Metallic Cyan Gradient -->
                        <linearGradient id="metallicCyan" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#66fcf1" />
                            <stop offset="50%" stop-color="#45a29e" />
                            <stop offset="100%" stop-color="#1f2833" />
                        </linearGradient>
                        <linearGradient id="brightCyan" x1="0%" y1="100%" x2="100%" y2="0%">
                            <stop offset="0%" stop-color="#45a29e" />
                            <stop offset="100%" stop-color="#66fcf1" />
                        </linearGradient>
                    </defs>

                    <!-- Tech Ring Outer -->
                    <circle cx="60" cy="60" r="54" fill="none" stroke="rgba(102, 252, 241, 0.1)" stroke-width="1" stroke-dasharray="4 4" />
                    <path d="M 60 4 A 56 56 0 0 1 116 60" fill="none" stroke="url(#brightCyan)" stroke-width="2" stroke-linecap="round"/>
                    <path d="M 60 116 A 56 56 0 0 1 4 60" fill="none" stroke="url(#brightCyan)" stroke-width="2" stroke-linecap="round"/>
                    
                    <!-- Smartphone Outline -->
                    <rect x="35" y="15" width="50" height="90" rx="8" fill="#0b0c10" stroke="url(#metallicCyan)" stroke-width="3" />
                    <!-- Camera Dot -->
                    <circle cx="60" cy="23" r="2" fill="#66fcf1" />
                    <!-- Home Bar -->
                    <line x1="50" y1="98" x2="70" y2="98" stroke="#45a29e" stroke-width="2" stroke-linecap="round" />

                    <!-- The Intertwined 'C' -->
                    <path d="M 65 40 A 18 18 0 1 0 65 76" fill="none" stroke="url(#brightCyan)" stroke-width="5" stroke-linecap="round" />
                    <!-- The 'T' -->
                    <path d="M 45 40 L 85 40 M 65 40 L 65 80" fill="none" stroke="#66fcf1" stroke-width="5" stroke-linecap="round" />
                    
                    <!-- Circuit Nodes on Logo -->
                    <circle cx="85" cy="40" r="3" fill="#0b0c10" stroke="#66fcf1" stroke-width="2" />
                    <circle cx="65" cy="80" r="3" fill="#0b0c10" stroke="#66fcf1" stroke-width="2" />
                    <circle cx="45" cy="76" r="2" fill="#66fcf1" />
                </svg>
            </div>

            <!-- Company Header -->
            <div class="text-center border-b border-darkCard pb-8 mb-8">
                <h1 class="text-3xl sm:text-5xl font-extrabold text-white tracking-tight mb-2">
                    Complex <span class="text-cyanBright text-glow">Thingies</span>
                </h1>
                <h2 class="text-xl sm:text-2xl font-medium text-grayText tracking-widest uppercase">
                    Development, LLC
                </h2>
            </div>

            <!-- Business Card Details / Contact Info -->
            <div class="flex flex-col md:flex-row justify-between items-center gap-8">
                
                <!-- Left: Name & Title -->
                <div class="text-center md:text-left">
                    <h3 class="text-2xl sm:text-3xl font-bold text-white mb-1">Mark A. Stephen</h3>
                    <p class="text-cyanBright font-mono tracking-widest text-sm uppercase text-glow">President</p>
                    <div class="mt-4 hidden md:block w-12 h-1 bg-cyanAccent rounded"></div>
                </div>

                <!-- Right: Contact Grid -->
                <div class="flex flex-col space-y-4 w-full md:w-auto">
                    
                    <a href="tel:9362221700" class="flex items-center group">
                        <div class="w-10 h-10 rounded-full bg-darkBase border border-cyanBright/30 flex items-center justify-center mr-4 group-hover:bg-cyanBright/10 group-hover:border-cyanBright transition-all group-hover:shadow-neon">
                            <i class="fa-solid fa-phone text-cyanBright"></i>
                        </div>
                        <span class="text-lg text-grayText group-hover:text-white transition-colors">936.222.1700</span>
                    </a>

                    <a href="mailto:complexthingies@gmail.com" class="flex items-center group">
                        <div class="w-10 h-10 rounded-full bg-darkBase border border-cyanBright/30 flex items-center justify-center mr-4 group-hover:bg-cyanBright/10 group-hover:border-cyanBright transition-all group-hover:shadow-neon">
                            <i class="fa-solid fa-envelope text-cyanBright"></i>
                        </div>
                        <span class="text-lg text-grayText group-hover:text-white transition-colors">complexthingies@gmail.com</span>
                    </a>

                    <a href="https://www.complexthingies.ai" target="_blank" class="flex items-center group">
                        <div class="w-10 h-10 rounded-full bg-darkBase border border-cyanBright/30 flex items-center justify-center mr-4 group-hover:bg-cyanBright/10 group-hover:border-cyanBright transition-all group-hover:shadow-neon">
                            <i class="fa-solid fa-globe text-cyanBright"></i>
                        </div>
                        <span class="text-lg text-grayText group-hover:text-white transition-colors">www.complexthingies.ai</span>
                    </a>

                    <div class="flex items-center group cursor-default">
                        <div class="w-10 h-10 rounded-full bg-darkBase border border-cyanBright/30 flex items-center justify-center mr-4 group-hover:bg-cyanBright/10 group-hover:border-cyanBright transition-all group-hover:shadow-neon">
                            <i class="fa-solid fa-location-dot text-cyanBright"></i>
                        </div>
                        <span class="text-lg text-grayText group-hover:text-white transition-colors">Livingston, Texas 77352</span>
                    </div>

                </div>
            </div>
            
            <!-- Binary Footer accent for the developer vibe -->
            <div class="mt-12 pt-6 border-t border-darkCard/50 text-center">
                <p class="font-mono text-[10px] sm:text-xs text-cyanBright/30 break-all leading-tight">
                    01100011 01101111 01101101 01110000 01101100 01100101 01111000 00100000 01110100 01101000 01101001 01101110 01100111 01101001 01100101 01110011
                </p>
            </div>
            
        </div>
    </main>

</body>
</html>
